name: Build Lakshya Khaki V44

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V44 FIXED BUILD project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -name 'LakshyaKhaki_Native_v44_FIXED_BUILD.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ LakshyaKhaki_Native_v44_FIXED_BUILD.zip not found"
            exit 1
          fi

          echo "✅ Found: $ZIP_FILE"

          rm -rf .project_extract
          mkdir -p .project_extract

          unzip -q "$ZIP_FILE" -d .project_extract

          SETTINGS_FILE="$(find .project_extract \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "✅ Project root: $PROJECT_ROOT"

          cp -a "$PROJECT_ROOT/." .

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LakshyaKhaki-V44-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
