name: Build Lakshya Khaki V44

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V44 Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -name 'LakshyaKhaki_V44_Gradle8.9_AGP8.7_FIXED.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ V44 ZIP not found"
            exit 1
          fi

          echo "✅ Found: $ZIP_FILE"

          rm -rf .project_extract
          mkdir -p .project_extract

          unzip -q -o "$ZIP_FILE" -d .project_extract

          SETTINGS_FILE="$(find .project_extract \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          cp -a "$PROJECT_ROOT/." .

          echo "✅ Android project extracted"

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cat gradle/wrapper/gradle-wrapper.properties

          grep -q "gradle-8.9-all.zip" \
            gradle/wrapper/gradle-wrapper.properties

          echo "✅ Gradle 8.9 verified"

      - name: Verify AGP
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'com.android.application.*8.7.0' \
            build.gradle.kts

          echo "✅ AGP 8.7.0 verified"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -name '*.apk' \
            -type f \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "❌ APK was not generated"
            exit 1
          fi

          echo "✅ APK created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LakshyaKhaki-V44-Gradle8.9-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
