name: Build Lakshya Khaki APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          unzip -o LakshyaKhaki_Native_v43_Personalized_Home.zip
          echo "Android project extracted"
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Fix Kotlin and KSP versions
        shell: bash
        run: |
          set -e
          sed -i 's/2\.0\.21-1\.0\.28/2.3.0/g' build.gradle.kts app/build.gradle.kts
          sed -i 's/2\.0\.21/2.3.0/g' build.gradle.kts app/build.gradle.kts
          echo "Kotlin and KSP versions updated"

      - name: Fix Room database configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/lakshyakhaki/app/data/AppDatabase.kt")
          s = p.read_text()

          s = s.replace(
              "@Database(entities = [QuizResult::class, GroundResult::class], version = 1)",
              "@Database(entities = [QuizResult::class, GroundResult::class], version = 1, exportSchema = false)"
          )

          p.write_text(s)
          print("Room configuration fixed")
          PY

      - name: Fix Compose ListItem
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/lakshyakhaki/app/MainActivity.kt")
          s = p.read_text()

          old = '''ListItem({Text(r.value+(if(event=="Shot Put")" m" else " sec"))},{Text(SimpleDateFormat("dd MMM, HH:mm",Locale.getDefault()).format(Date(r.timestamp)))})'''

          new = '''ListItem(
              headlineContent = {
                  Text(r.value + (if(event=="Shot Put") " m" else " sec"))
              },
              supportingContent = {
                  Text(
                      SimpleDateFormat(
                          "dd MMM, HH:mm",
                          Locale.getDefault()
                      ).format(Date(r.timestamp)))
              }
          )'''

          if old not in s:
              print("ListItem pattern not found - checking whether it is already fixed")
          else:
              s = s.replace(old, new)
              p.write_text(s)
              print("Compose ListItem fixed")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -e
          ls -lh app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          echo "APK successfully created"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lakshya-khaki-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
