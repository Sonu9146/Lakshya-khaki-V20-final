name: Build Lakshya Khaki APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract V44 project FIRST
      - name: Find and extract V44 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f \
            -name 'LakshyaKhaki_Native_v44_GRADLE8_9_READY.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ V44 ZIP not found"
            exit 1
          fi

          echo "✅ Found: $ZIP_FILE"

          mkdir -p .project_extract
          unzip -q "$ZIP_FILE" -d .project_extract

          SETTINGS_FILE="$(find .project_extract \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "✅ Project root: $PROJECT_ROOT"

          cp -a "$PROJECT_ROOT/." .

          echo "✅ V44 project extracted"

      # 3. Setup JDK AFTER extraction
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Verify project files
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "✅ Android project files found"

      # 5. Verify Gradle 8.9 wrapper
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar

          chmod +x gradlew

          grep -q "gradle-8.9-all.zip" \
            gradle/wrapper/gradle-wrapper.properties

          echo "✅ Gradle 8.9 wrapper verified"

      # 6. Verify AGP 8.7.0
      - name: Verify Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          grep -q '8.7.0' build.gradle.kts

          echo "✅ Android Gradle Plugin 8.7.0 verified"

      # 7. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LakshyaKhaki-V44-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
