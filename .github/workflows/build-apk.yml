name: Build Lakshya Khaki APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract V44 project
      - name: Extract V44 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f \
            -name 'LakshyaKhaki_Native_v44_GRADLE8_9_READY.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ V44 ZIP not found"
            exit 1
          fi

          echo "✅ Found: $ZIP_FILE"

          mkdir -p .project_extract
          unzip -q "$ZIP_FILE" -d .project_extract

          SETTINGS_FILE="$(find .project_extract \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ settings.gradle.kts not found in ZIP"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "✅ Project root: $PROJECT_ROOT"

          cp -a "$PROJECT_ROOT/." .

      # 3. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "🔍 Checking Gradle..."

          if [ -f "./gradlew" ]; then
            echo "✅ Gradle wrapper found"

            chmod +x ./gradlew

            echo "🚀 Building with Gradle wrapper..."

            ./gradlew :app:assembleDebug \
              --no-daemon \
              --stacktrace

          elif command -v gradle >/dev/null 2>&1; then
            echo "⚠️ gradlew not found"
            echo "✅ Using installed Gradle..."

            gradle :app:assembleDebug \
              --no-daemon \
              --stacktrace

          else
            echo "❌ Neither gradlew nor installed Gradle was found"
            exit 1
          fi

      # 5. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LakshyaKhaki-V44-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
