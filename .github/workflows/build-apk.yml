name: Build Lakshya Khaki V44

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract Android Project ZIP
      - name: Extract V44 Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ V44 ZIP not found"
            exit 1
          fi

          echo "✅ Found ZIP: $ZIP_FILE"

          rm -rf .tmp_extract
          mkdir -p .tmp_extract

          unzip -q -o "$ZIP_FILE" -d .tmp_extract

          SETTINGS_FILE="$(find .tmp_extract -type f \( \
            -name 'settings.gradle.kts' -o \
            -name 'settings.gradle' \
          \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ settings.gradle.kts not found inside ZIP"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "✅ Project root: $PROJECT_ROOT"

          cp -a "$PROJECT_ROOT"/. ./

          rm -rf .tmp_extract

          echo "✅ Android project extracted"

      # 3. Verify Gradle Wrapper
      - name: Verify Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "❌ Gradle wrapper not found"
            exit 1
          fi

          cat gradle/wrapper/gradle-wrapper.properties

          grep -q "gradle-8.9-all.zip" \
            gradle/wrapper/gradle-wrapper.properties

          echo "✅ Gradle 8.9 verified"

      # 4. Verify AGP
      - name: Verify AGP 8.7.0
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "build.gradle.kts" ]; then
            echo "❌ Root build.gradle.kts not found"
            exit 1
          fi

          grep -q 'com.android.application.*8.7.0' \
            build.gradle.kts

          echo "✅ Android Gradle Plugin 8.7.0 verified"

      # 5. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 6. Setup Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Show environment
      - name: Check Java and Gradle
        shell: bash
        run: |
          java -version
          gradle --version

      # 8. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 9. Check APK
      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "❌ APK was not generated"
            exit 1
          fi

          echo "✅ APK successfully created:"
          ls -lh "$APK"

      # 10. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LakshyaKhaki-V44-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
